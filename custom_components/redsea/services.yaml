# Service ID
clean_message:
  fields:
    device_id:
      name: Device ID
      description: The ID of the device(s) to use.
      required: true
      selector:
        config_entry:
          integration: redsea
    msg_type:
      required: true
      description: Type of message to clean
      default: "All"
      example: "last_alert_message"
      selector:
        select:
          options:
            - "All"
            - "last_message"
            - "last_alert_message"
# Service ID
request:
  fields:
    device_id:
      name: Device ID
      description: The ID of the device(s) to use.
      required: true
      selector:
        config_entry:
          integration: redsea
    access_path:
      required: true
      description: Access pass
      default: "/"
      example: "/mode"
      selector:
        text:
    method:
      required: true
      description: HTTP method
      default: "post"
      example: "post"
      selector:
        select:
          options:
            - "post"
            - "put"
            - "delete"
            - "get"
    data:
      required: true
      description: JSON data to send to device
      example: "{'mode': 'auto'}"
      default: "{}"
      selector:
        text:
    refresh:
      required: false
      description: >-
        Which sources to re-read once the request has been sent. The device
        is always re-read; this only chooses what. Defaults to "config",
        which covers endpoints served as configuration such as a socket
        schedule.
      default: "config"
      example: "config"
      selector:
        select:
          options:
            - "data"
            - "config"
    wait:
      required: false
      description: >-
        Seconds to let the device settle before re-reading. Several endpoints
        acknowledge a write before they serve the new value back, so reading
        immediately returns the previous one.
      default: 2
      example: 3
      selector:
        number:
          min: 0
          max: 30
          unit_of_measurement: seconds

# Reset a maintenance task: stamps "now" as the new last_reset for the
# (device, task) instance and recomputes derived values (days_left, overdue).
reset_maintenance:
  fields:
    device_id:
      name: Device
      description: Target device (or sub-device, e.g. RSDOSE head, RSRUN pump).
      required: true
      selector:
        device:
          integration: redsea
    task_key:
      name: Task key
      description: >
        Stable maintenance task identifier (see maintenance.TASKS keys, e.g.
        'ato_ec_sensor', 'run_skim_venturi', 'led_lens').
      required: true
      example: "led_lens"
      selector:
        text:

# Look up a RSCONTROL hub's probes (identity + current values) by hardware
# id — meant for a paired RSPower device's card, which only knows that
# hub's hwid (from its own /dashboard.connected_device.hwid), not a Home
# Assistant device_id for a different device.
get_control_probes:
  fields:
    hwid:
      name: Hub hardware ID
      description: >-
        The RSCONTROL hub's hardware id (hwid), e.g. as reported in a
        paired RSPower's connected_device.hwid.
      required: true
      example: "d4e9f4e89208"
      selector:
        text:

# Read back the rules a RSCONTROL hub applies to the sockets of its paired
# RSPower (live GET /subscription-info), by hardware id like
# get_control_probes: the RSPower only stores the probe type a socket
# follows, the hub keeps the probe uid, sub-sensor and thresholds.
get_control_subscriptions:
  fields:
    hwid:
      name: Hub hardware ID
      description: >-
        The RSCONTROL hub's hardware id (hwid), e.g. as reported in a
        paired RSPower's connected_device.hwid.
      required: true
      example: "d4e9f4e89208"
      selector:
        text:

# Multi-point calibration of a RSCONTROL pH or EC probe, one step per call:
# enter, then point (per calibration point) and status (poll until it
# succeeds or fails), then exit. Returns the hub's answer.
probe_calibration:
  fields:
    device_id:
      name: Device ID
      description: The RSCONTROL hub (config entry).
      required: true
      selector:
        config_entry:
          integration: redsea
    probe_type:
      name: Probe type
      description: Type of the probe to calibrate.
      required: true
      example: "ph"
      selector:
        select:
          options:
            - "ph"
            - "ec"
    probe_uid:
      name: Probe uid
      description: Uid of the probe, as the hub reports it.
      required: true
      example: "0x00B39"
      selector:
        text:
    action:
      name: Step
      description: Calibration step.
      required: true
      selector:
        select:
          options:
            - "enter"
            - "point"
            - "status"
            - "exit"
    point:
      name: Point
      description: Calibration point (step "point").
      required: false
      selector:
        select:
          options:
            - "LOW"
            - "MID"
            - "HIGH"
    solution_value:
      name: Solution value
      description: Value of the calibration solution (pH, or mS/cm for EC).
      required: false
      example: 7.0
      selector:
        number:
          min: 0
          max: 100
          step: 0.001
          mode: box
    solution_rated_temp:
      name: Solution rated temperature
      description: Temperature the solution value is given at, °C (pH only).
      required: false
      example: 25
      selector:
        number:
          min: 0
          max: 50
          mode: box

# Convert G1 ReefLED points between white/blue and kelvin/intensity, with the
# lamp's own model table and intensity compensation (used by the card's
# program editor).
led_convert:
  fields:
    device_id:
      name: Device ID
      description: The config entry of the G1 ReefLED.
      required: true
      selector:
        config_entry:
          integration: redsea
    points:
      name: Points
      description: >-
        List of points, each either (kelvin, intensity) or (white, blue).
      required: true
      example: '[{"kelvin": 15000, "intensity": 80}, {"white": 50, "blue": 100}]'
      selector:
        object:

# Light programs of the cloud library of a ReefLED's aquarium (used by the
# card's program editor).
led_library:
  fields:
    device_id:
      name: Device ID
      description: The config entry of the ReefLED (or virtual LED).
      required: true
      selector:
        config_entry:
          integration: redsea

# Add a light program to the cloud library of a ReefLED, or update one.
led_library_save:
  fields:
    device_id:
      name: Device ID
      description: The config entry of the ReefLED (or virtual LED).
      required: true
      selector:
        config_entry:
          integration: redsea
    name:
      name: Name
      description: Name of the program in the library.
      required: true
      example: prog-202609281930
      selector:
        text:
    program:
      name: Program
      description: >-
        Day program in the lamp's format, on a single day's timeline: white,
        blue and moon channels (G1) or color and moon (G2).
      required: true
      selector:
        object:
    clouds:
      name: Clouds
      description: Clouds of the program (from, to, intensity), if any.
      required: false
      selector:
        object:
    uid:
      name: Program ID
      description: >-
        The library program to update; leave empty to add a new one. The Red
        Sea programs cannot be updated.
      required: false
      selector:
        text:

# Delete one of the user's programs from the cloud library of a ReefLED.
led_library_delete:
  fields:
    device_id:
      name: Device ID
      description: The config entry of the ReefLED (or virtual LED).
      required: true
      selector:
        config_entry:
          integration: redsea
    uid:
      name: Program ID
      description: The library program to delete (not a Red Sea one).
      required: true
      selector:
        text:

# Fetch the weather again and send the week to a ReefLED in GPS weather mode.
led_weather_apply:
  fields:
    device_id:
      name: Device ID
      description: The config entry of the ReefLED (or virtual LED).
      required: true
      selector:
        config_entry:
          integration: redsea

led_weather_preview:
  fields:
    device_id:
      name: Device ID
      description: The config entry of the ReefLED (or virtual LED).
      required: true
      selector:
        config_entry:
          integration: redsea
    settings:
      name: Settings
      description: Weather settings being edited (period, anchor, location, sunrise, sunset, min_intensity, max_intensity, clouds, refresh_days), over the stored ones.
      required: false
      selector:
        object:

led_weather_save:
  fields:
    device_id:
      name: Device ID
      description: The config entry of the ReefLED (or virtual LED).
      required: true
      selector:
        config_entry:
          integration: redsea
    settings:
      name: Settings
      description: Weather settings being edited (period, anchor, location, sunrise, sunset, min_intensity, max_intensity, clouds, refresh_days), over the stored ones.
      required: false
      selector:
        object:
    enabled:
      name: Weather mode
      description: Whether the lamp follows the weather.
      required: true
      selector:
        boolean:
    wait:
      name: Wait for the lamp
      description: Answer once the lamp is written (by default the week is saved and shown, then written in the background).
      required: false
      selector:
        boolean:

# Waves a ReefWave can use, the pumps using them and its group.
wave_library:
  fields:
    device_id:
      name: Device ID
      description: The config entry of the ReefWave.
      required: true
      selector:
        config_entry:
          integration: redsea

# Add a wave to the cloud library of a ReefWave's aquarium, or update one.
wave_library_save:
  fields:
    device_id:
      name: Device ID
      description: The config entry of the ReefWave.
      required: true
      selector:
        config_entry:
          integration: redsea
    name:
      name: Name
      description: Name of the wave, unique in the library.
      required: true
      example: Storm
      selector:
        text:
    settings:
      name: Settings
      description: type, frt, rrt, pd, sn (as the type uses them), fti, rti, sync.
      required: true
      selector:
        object:
    uid:
      name: Wave ID
      description: The wave to update; leave empty to add a new one.
      required: false
      selector:
        text:

# Delete one of the user's waves from the cloud library.
wave_library_delete:
  fields:
    device_id:
      name: Device ID
      description: The config entry of the ReefWave.
      required: true
      selector:
        config_entry:
          integration: redsea
    uid:
      name: Wave ID
      description: The wave to delete.
      required: true
      selector:
        text:

# Write the day program of a ReefWave (of its whole group).
wave_program_save:
  fields:
    device_id:
      name: Device ID
      description: The config entry of the ReefWave.
      required: true
      selector:
        config_entry:
          integration: redsea
    slots:
      name: Slots
      description: List of (st, wave_uid, direction); the first one starts at 0.
      required: true
      selector:
        object:

# Run a wave on a ReefWave for a while (preview).
wave_preview:
  fields:
    device_id:
      name: Device ID
      description: The config entry of the ReefWave.
      required: true
      selector:
        config_entry:
          integration: redsea
    settings:
      name: Settings
      description: type, frt, rrt, pd, sn (as the type uses them), fti, rti.
      required: true
      selector:
        object:
    direction:
      name: Direction
      description: fw, rw or alt.
      required: true
      selector:
        select:
          options: ["fw", "rw", "alt"]
    duration:
      name: Duration
      description: Duration of the preview, in ms (60000 to 600000).
      required: false
      default: 300000
      selector:
        number:
          min: 60000
          max: 600000
          step: 60000

# Stop the preview of a ReefWave.
wave_preview_stop:
  fields:
    device_id:
      name: Device ID
      description: The config entry of the ReefWave.
      required: true
      selector:
        config_entry:
          integration: redsea

# Set this pump's direction and intensities in the current wave.
wave_pump_set:
  fields:
    device_id:
      name: Device ID
      description: The config entry of the ReefWave.
      required: true
      selector:
        config_entry:
          integration: redsea
    direction:
      name: Direction
      description: fw, rw or alt.
      required: true
      selector:
        select:
          options: ["fw", "rw", "alt"]
    fti:
      name: Forward intensity
      description: Forward intensity of this pump, in %.
      required: true
      selector:
        number:
          min: 0
          max: 100
    rti:
      name: Reverse intensity
      description: Reverse intensity of this pump, in %.
      required: true
      selector:
        number:
          min: 0
          max: 100

# Order the pumps of a ReefWave's group.
wave_group_order:
  fields:
    device_id:
      name: Device ID
      description: The config entry of a ReefWave of the group.
      required: true
      selector:
        config_entry:
          integration: redsea
    hwids:
      name: Pumps
      description: Hardware ids of every pump of the group, in the new order.
      required: true
      selector:
        object:

# Group a ReefWave with its aquarium's other ReefWaves, or ungroup it.
wave_group_set:
  fields:
    device_id:
      name: Device ID
      description: The config entry of the ReefWave.
      required: true
      selector:
        config_entry:
          integration: redsea
    grouped:
      name: Grouped
      description: True to group the pump with the other ReefWaves of its aquarium, false to ungroup it.
      required: true
      selector:
        boolean:

# Today's speeds the GPS weather would give the pumps of a ReefWave group.
wave_weather_preview:
  fields:
    device_id:
      name: Device ID
      description: The config entry of the ReefWave.
      required: true
      selector:
        config_entry:
          integration: redsea
    settings:
      name: Settings
      description: Settings being edited (location, source, scale, day_min, day_max, night_min, night_max, tolerance).
      required: false
      selector:
        object:
    offsets:
      name: Offsets
      description: Offset of each pump of the group (percent), by hardware id.
      required: false
      selector:
        object:

# Save the GPS weather of a ReefWave group and write its pumps.
wave_weather_save:
  fields:
    device_id:
      name: Device ID
      description: The config entry of the ReefWave.
      required: true
      selector:
        config_entry:
          integration: redsea
    settings:
      name: Settings
      description: Settings shared by the group (location, source, scale, day_min, day_max, night_min, night_max, tolerance).
      required: false
      selector:
        object:
    offsets:
      name: Offsets
      description: Offset of each pump of the group (percent), by hardware id.
      required: false
      selector:
        object:
    enabled:
      name: Enabled
      description: True for the weather mode, false to give the pumps their own program back.
      required: true
      selector:
        boolean:
